name: CodeQL

# MVP security gate (HX-Fortress OSS Readiness Plan, Part 4.2): GitHub-native
# static analysis with the security-extended query suite. Third-party actions
# are pinned to a full commit SHA (tag recorded in the trailing comment).

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 7 * * 1" # weekly (Mon 07:00 UTC)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the code-scanning dashboard
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
